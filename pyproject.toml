[project]
name = "deepseek-tool-agent"
version = "0.1.0"
description = "A small, production-shaped tool-calling agent (LangChain + DeepSeek + FastAPI + SSE)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `workspace/` and `data/` are runtime content written by the agent, not sources.
exclude = [".venv", ".uv-cache", "data", ".scratch", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003: the project ships Chinese copy and Chinese punctuation on purpose.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
