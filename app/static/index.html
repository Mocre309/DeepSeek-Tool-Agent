  /* ------------------------------------------------------------------ *
   * Tool timeline cards                                                *
   * ------------------------------------------------------------------ */
  function toolCard(traceEl, data) {
    // Resuming an approval replays the model update, so the same call id can
    // arrive twice — rendering must be idempotent per call.
    if (data.id) {
      const existing = traceEl.querySelector(`.tool[data-id="${CSS.escape(String(data.id))}"]`);
      if (existing) return existing;
    }
    const card = document.createElement("div");
    card.className = "tool running";
    card.dataset.id = data.id || "";
    card.innerHTML = `
      <div class="tool-head">
        <span class="tool-caret">▶</span>
        <span class="tool-icon">${data.icon || "🔧"}</span>
        <span class="tool-name">${escapeHtml(data.label || data.name || "tool")}</span>
        <span class="tool-status">运行中</span>
        <span class="spinner"></span>
        <span class="tool-elapsed"></span>
      </div>
      <div class="tool-body">
        <div class="tool-label">参数</div>
        <pre class="tool-args"></pre>
        <div class="tool-result-wrap" hidden>
          <div class="tool-label">返回</div>
          <pre class="tool-result"></pre>
        </div>
      </div>`;
    card.querySelector(".tool-args").textContent = formatArgs(data.args);
    card.querySelector(".tool-head").addEventListener("click", () => card.classList.toggle("open"));
    traceEl.appendChild(card);
    scrollToBottom();
    return card;
  }

  function formatArgs(args) {
    if (args == null) return "—";
    if (typeof args !== "object") return String(args);
    const keys = Object.keys(args);
    if (!keys.length) return "—";
    return keys.map((k) => `${k} = ${typeof args[k] === "string" ? args[k] : JSON.stringify(args[k])}`).join("\n");
  }

  function finishToolCard(traceEl, data) {
    let card = data.id ? traceEl.querySelector(`.tool[data-id="${CSS.escape(String(data.id))}"]`) : null;
    if (!card) {
      card = toolCard(traceEl, { id: data.id, name: data.name, label: data.name, icon: "🔧" });
    }
    const status = data.status || "ok";
    const failed = status === "error";
    const rejected = status === "rejected";
    card.classList.remove("running");
    card.classList.add(failed ? "error" : rejected ? "rejected" : "ok");
    card.querySelector(".tool-status").textContent = failed
      ? "失败"
      : rejected
        ? "已拒绝"
        : "完成";
    const spinner = card.querySelector(".spinner");
    if (spinner) spinner.remove();
    card.querySelector(".tool-elapsed").textContent =
      data.elapsed_ms != null ? `${data.elapsed_ms} ms` : "";
    const wrap = card.querySelector(".tool-result-wrap");
    wrap.hidden = false;
    card.querySelector(".tool-result").textContent = data.content || "（空）";
    if (failed || rejected) card.classList.add("open");

    // If a tool produced a stored file, give the user a real download button.
    // It sits outside the collapsible body so it is visible while collapsed.
    const stored = /\/api\/(?:files|workspace)\/[A-Za-z0-9._\-\/%]{1,300}/.exec(
      data.content || ""
    );
    if (stored && !rejected && !card.querySelector(".download-link")) {
      const link = document.createElement("a");
      link.className = "download-link";
      link.href = stored[0];
      const shown = decodeURI(stored[0].split("/").pop() || stored[0]);
      link.setAttribute("download", shown);
      link.textContent = `⬇ 下载 ${shown}`;
      card.appendChild(link);
    }
    scrollToBottom();
  }

  /* ------------------------------------------------------------------ *
   * SSE over fetch (POST body ⇒ EventSource is not an option)           *
   * ------------------------------------------------------------------ */
  function parseFrame(raw) {
    let event = "message";
    const dataLines = [];
    for (const line of raw.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
    }
    if (!dataLines.length) return null;
    try {
      return { event, data: JSON.parse(dataLines.join("\n")) };
    } catch {
      return null;
    }
  }

  /** Per-turn state so an approval resume can keep appending to the same bubble. */
  function createTurn(view) {
    return {
      view,
      sessionId,
      answer: "",
      reasoning: "",
      pendingRender: false,
      finished: false,
      awaiting: false,
      joinedLater: false,
    };
  }

  /** True while this turn's conversation is the one on screen. */
  function isLive(turn) {
    return turn.sessionId === sessionId;
  }

  function paintTurn(turn) {
    turn.pendingRender = false;
    if (!isLive(turn)) return; // switched away: keep buffering, don't touch the DOM
    const cursor = turn.finished ? "" : '<span class="cursor"></span>';
    turn.view.md.innerHTML = renderMarkdown(visibleAnswer(turn.answer)) + cursor;
    scrollToBottom();
  }

  function schedulePaint(turn) {
    if (!turn.pendingRender) {
      turn.pendingRender = true;
      requestAnimationFrame(() => paintTurn(turn));
    }
  }

  async function pumpStream(url, body, turn) {
    const view = turn.view;
    const controller = new AbortController();
    running.set(turn.sessionId, { controller, turn });
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!response.ok || !response.body) {
      let detail = "";
      try {
        const payload = await response.json();
        if (Array.isArray(payload.detail)) {
          detail = payload.detail.map((item) => item.msg || item).join("；");
        } else if (payload.detail) {
          detail = String(payload.detail);
        }
      } catch { /* not JSON */ }
      throw new Error(`HTTP ${response.status}${detail ? "：" + detail : ""}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    turn.finished = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const frame = parseFrame(buffer.slice(0, idx));
        buffer = buffer.slice(idx + 2);
        if (!frame) continue;
        const { event, data } = frame;

        if (event === "token") {
          // The answer started: fold the reasoning panel away so the reply is in view.
          if (isLive(turn) && !turn.answer && turn.reasoning) {
            view.think.classList.remove("open");
          }
          turn.answer += data.text || "";
          schedulePaint(turn);
        } else if (event === "reasoning") {
          turn.reasoning += data.text || "";
          if (!isLive(turn)) continue;
          view.think.hidden = false;
          view.think.classList.add("open");
          view.thinkCount.textContent = `${turn.reasoning.length} 字`;
          view.thinkBody.textContent = turn.reasoning;
          scrollToBottom();
        } else if (event === "tool_call") {
          if (isLive(turn)) toolCard(view.trace, data);
        } else if (event === "tool_result") {
          if (isLive(turn)) finishToolCard(view.trace, data);
        } else if (event === "approval_required") {
          turn.awaiting = true;
          // A background turn cannot ask for approval; switching back restores the
          // prompt from the server (see restorePending).
          if (isLive(turn)) showApproval(view, data, turn);
        } else if (event === "error") {
          if (!isLive(turn)) continue;
          view.err.innerHTML = "";
          const box = document.createElement("div");
          box.className = "err-box";
          box.textContent = "⚠️ " + (data.message || "未知错误");
          view.err.appendChild(box);
        } else if (event === "usage") {
          if (!isLive(turn)) continue;
          view.stats.innerHTML =
            `tokens <b>${data.input_tokens}+${data.output_tokens}=${data.total_tokens}</b>` +
            ` · 工具调用 <b>${data.tool_calls}</b>` +
            ` · 耗时 <b>${(data.elapsed_ms / 1000).toFixed(2)}s</b>`;
        } else if (event === "done") {
          if (data.awaiting_approval) turn.awaiting = true;
        }
      }
    }

    turn.finished = true;
    if (!isLive(turn)) return turn.answer; // buffered only: nothing on screen to paint
    if (turn.answer) {
      paintAssistant(view, turn.answer);
    } else {
      view.md.innerHTML = view.md.innerHTML.replace(/<span class="cursor"><\/span>/, "");
    }
    return turn.answer;
  }

  /** Shared cleanup for every turn: unregister and refocus the right conversation. */
  async function finishTurn(owner, turn) {
    running.delete(owner);
    const here = owner === sessionId;
    if (here) {
      setStreaming(false);
      refreshTurnActions();
      if (!turn.joinedLater) scrollToBottom();
    } else {
      setStreaming(isRunning());
    }
    await refreshSessions(); // title / turn count / ordering, even for background turns
    if (here && turn.joinedLater) {
      // We came back while it was running; now the stored history is complete.
      await loadHistory(owner);
      refreshTurnActions();
    }
  }

  /* ------------------------------------------------------------------ *
   * Approval gate — nothing runs until the user decides                 *
   * ------------------------------------------------------------------ */
  function showApproval(view, request, turn) {
    const card = document.createElement("div");
    card.className = "approval";
    const args = formatArgs(request.args);
    card.innerHTML = `
      <div class="approval-head">${escapeHtml(request.icon || "⚠️")} Agent 请求调用「${escapeHtml(request.label || request.tool)}」</div>
      <div class="approval-args"></div>
      <div class="approval-actions">
        <button class="approve" type="button">允许执行</button>
        <button class="reject" type="button">拒绝</button>
      </div>`;
    card.querySelector(".approval-args").textContent = args;
    view.trace.appendChild(card);
    scrollToBottom();

    const decide = async (approved) => {
      card.classList.add("done");
      card.querySelector(".approval-actions").replaceChildren();
      const verdict = document.createElement("div");
      verdict.className = "approval-verdict";
      verdict.textContent = approved ? "✅ 已允许执行" : "🚫 已拒绝";
      card.appendChild(verdict);
      turn.awaiting = false;
      const owner = sessionId;
      turn.sessionId = owner;
      setStreaming(true);
      try {
        await pumpStream(
          `/api/sessions/${encodeURIComponent(owner)}/resume`,
          { approved },
          turn
        );
        if (!turn.answer) {
          turn.view.md.innerHTML = '<span style="color:var(--muted)">（本轮没有文本输出）</span>';
        }
      } catch (error) {
        const box = document.createElement("div");
        box.className = "err-box";
        box.textContent = "继续执行失败：" + error.message;
        view.err.appendChild(box);
      } finally {
        await finishTurn(owner, turn);
      }
    };

    card.querySelector(".approve").addEventListener("click", () => decide(true));
    card.querySelector(".reject").addEventListener("click", () => decide(false));
  }

  async function restorePending(view) {
    try {
      const payload = await fetch(
        `/api/sessions/${encodeURIComponent(sessionId)}/pending`
      ).then((r) => r.json());
      if (!payload.pending) return false;
      showApproval(view, payload.pending, createTurn(view));
      return true;
    } catch {
      return false;
    }
  }

  /* ------------------------------------------------------------------ *
   * Send / stop / reset                                                *
   * ------------------------------------------------------------------ */
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
  }

  function setStreaming(on) {
    streaming = on;
    sendBtn.textContent = on ? "停止" : "发送";
    sendBtn.classList.toggle("stop", on);
    attachBtn.disabled = on || !supportsImages;
  }

  /* ------------------------------------------------------------------ *
   * Image staging: downscale in the browser, send as data URLs          *
   * ------------------------------------------------------------------ */
  function downscale(file) {
    return new Promise((resolve, reject) => {
      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; // flatten transparency before JPEG encoding
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);
        resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        reject(new Error("无法读取这张图片"));
      };
      img.src = objectUrl;
    });
  }

  function renderAttachments() {
    attachmentsEl.innerHTML = "";
    attachmentsEl.hidden = pendingImages.length === 0;
    for (const item of pendingImages) {
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = item.dataUrl;
      img.alt = item.name;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "✕";
      remove.title = "移除";
      remove.addEventListener("click", () => {
        pendingImages = pendingImages.filter((entry) => entry.id !== item.id);
        renderAttachments();
      });
      thumb.append(img, remove);
      attachmentsEl.appendChild(thumb);
    }
  }

  async function addFiles(fileList) {
    const files = Array.from(fileList || []).filter((file) => file.type.startsWith("image/"));
    if (!files.length) return;
    if (!supportsImages) {
      notify("当前模型不支持图片输入，把 DEEPSEEK_MODEL 换成 deepseek-flash");
      return;
    }
    for (const file of files) {
      if (pendingImages.length >= MAX_IMAGES) {
        notify(`单条消息最多 ${MAX_IMAGES} 张图片`);
        break;
      }
      try {
        const dataUrl = await downscale(file);
        pendingImages.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          dataUrl,
          name: file.name,
        });
      } catch (error) {
        notify(error.message);
      }
    }
    renderAttachments();
  }

  function clearAttachments() {
    pendingImages = [];
    renderAttachments();
  }

  function notify(message, kind = "warn") {
    const box = document.createElement("div");
    box.className = "err-box" + (kind === "ok" ? " ok" : "");
    box.textContent = (kind === "ok" ? "✅ " : "⚠️ ") + message;
    box.style.margin = "0 0 8px";
    composerWrap.insertBefore(box, composerWrap.firstChild);
    setTimeout(() => box.remove(), 6000);
  }

  /* ------------------------------------------------------------------ *
   * Conversations — the server owns the list, localStorage the current  *
   * ------------------------------------------------------------------ */
  function relativeTime(epochSeconds) {
    const delta = Math.max(0, Date.now() / 1000 - epochSeconds);
    if (delta < 60) return "刚刚";
    if (delta < 3600) return `${Math.floor(delta / 60)} 分钟前`;
    if (delta < 86400) return `${Math.floor(delta / 3600)} 小时前`;
    return `${Math.floor(delta / 86400)} 天前`;
  }

  /** Set while a conversation row is being dragged, to gate drop targets. */
  let draggingSessionId = null;

  /** One conversation row: click to open, ··· for actions, drag to regroup. */
  function conversationRow(item) {
    const row = document.createElement("div");
    row.className = "conv" + (item.session_id === sessionId ? " active" : "");
    row.title = item.title;
    row.draggable = true;

    const title = document.createElement("div");
    title.className = "conv-title";
    title.textContent = item.title || "新对话";

    const meta = document.createElement("div");
    meta.className = "conv-meta";
    meta.textContent = `${item.turns} 轮 · ${relativeTime(item.last_active)}`;

    const more = document.createElement("button");
    more.type = "button";
    more.className = "conv-more";
    more.title = "更多操作（重命名 / 分组 / 删除）";
    more.textContent = "···";
    more.addEventListener("click", (event) => {
      event.stopPropagation();
      if (row.classList.contains("menu-open")) closeConvMenu(row);
      else openConversationMenu(row, item);
    });

    // ··· sits right after the title, on the same line.
    const head = document.createElement("div");
    head.className = "conv-head";
    head.append(title, more);

    row.append(head, meta);
    row.addEventListener("click", (event) => {
      if (event.target.closest(".conv-menu") || event.target.closest(".conv-more")) return;
      switchSession(item.session_id);
    });
    row.addEventListener("dragstart", (event) => {
      draggingSessionId = item.session_id;
      event.dataTransfer.setData("text/plain", item.session_id);
      event.dataTransfer.effectAllowed = "move";
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", () => {
      draggingSessionId = null;
      row.classList.remove("dragging");
      document.querySelectorAll(".conv-group.drop-hover").forEach((element) => {
        element.classList.remove("drop-hover");
      });
    });
    return row;
  }

  function closeConvMenu(row) {
    row.querySelectorAll(".conv-menu").forEach((menu) => menu.remove());
    row.classList.remove("menu-open");
  }

  function closeAllConvMenus() {
    document.querySelectorAll(".conv.menu-open").forEach((row) => closeConvMenu(row));
  }

  function openConversationMenu(row, item) {
    closeAllConvMenus();
    row.classList.add("menu-open");

    const menu = document.createElement("div");
    menu.className = "conv-menu";
    menu.addEventListener("click", (event) => event.stopPropagation());

    const renameBtn = document.createElement("button");
    renameBtn.type = "button";
    renameBtn.textContent = "✎ 重命名 / 改分组";
    renameBtn.addEventListener("click", () => {
      closeConvMenu(row);
      openConversationEditor(row, item);
    });

    const moveLabel = document.createElement("div");
    moveLabel.className = "menu-label";
    moveLabel.textContent = "移动到分组（也可以直接拖到分组上）";
    menu.append(renameBtn, moveLabel);

    const current = item.group_name || "";
    const targets = [
      { name: "", label: "未分组" },
      ...groups.map((group) => ({ name: group.name, label: group.name })),
    ];
    for (const target of targets) {
      if (target.name === current) continue;
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `→ ${target.label}`;
      button.addEventListener("click", () => {
        closeConvMenu(row);
        moveToGroup(item.session_id, target.name);
      });
      menu.appendChild(button);
    }

    const newGroupInput = document.createElement("input");
    newGroupInput.type = "text";
    newGroupInput.maxLength = 40;
    newGroupInput.placeholder = "新建分组并移入…";
    newGroupInput.addEventListener("keydown", (event) => {
      event.stopPropagation();
      if (event.key === "Escape") {
        closeConvMenu(row);
        return;
      }
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        const name = newGroupInput.value.trim();
        if (!name) return;
        closeConvMenu(row);
        moveToGroup(item.session_id, name);
      }
    });
    menu.appendChild(newGroupInput);

    const sep = document.createElement("div");
    sep.className = "menu-sep";

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "danger";
    deleteBtn.textContent = "🗑 删除这个对话";
    deleteBtn.addEventListener("click", () => {
      closeConvMenu(row);
      deleteConversation(item.session_id);
    });
    menu.append(sep, deleteBtn);

    row.appendChild(menu);
    newGroupInput.focus();
  }

  async function moveToGroup(targetSessionId, groupName) {
    try {
      const response = await fetch(`/api/sessions/${encodeURIComponent(targetSessionId)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ group_name: groupName }),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(typeof payload.detail === "string" ? payload.detail : "移动失败");
      }
      await refreshSessions();
      notify(groupName ? `已移动到「${groupName}」` : "已移出分组", "ok");
    } catch (error) {
      notify("移动失败：" + error.message);
    }
  }

  /** Inline rename + "move to group" editor, saved in one PATCH. */
  function openConversationEditor(row, item) {
    row.innerHTML = "";
    row.classList.add("editing");
    row.draggable = false; // inputs inside a draggable row fight with selection

    const editor = document.createElement("div");
    editor.className = "conv-editor";

    const titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.maxLength = 60;
    titleInput.value = item.title || "";
    titleInput.placeholder = "对话标题";

    const groupInput = document.createElement("input");
    groupInput.type = "text";
    groupInput.maxLength = 40;
    groupInput.value = item.group_name || "";
    groupInput.placeholder = "分组（留空 = 未分组）";
    groupInput.setAttribute("list", "group-options");

    const actionRow = document.createElement("div");
    actionRow.className = "conv-editor-actions";
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "save";
    saveBtn.textContent = "保存";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.textContent = "取消";
    actionRow.append(saveBtn, cancelBtn);
    editor.append(titleInput, groupInput, actionRow);
    row.appendChild(editor);

    const cancel = () => renderConversations();
    const save = async () => {
      const title = titleInput.value.trim();
      if (!title) {
        titleInput.focus();
        return;
      }
      try {
        const response = await fetch(`/api/sessions/${encodeURIComponent(item.session_id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, group_name: groupInput.value.trim() }),
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(typeof payload.detail === "string" ? payload.detail : "保存失败");
        }
        await refreshSessions();
      } catch (error) {
        notify("保存失败：" + error.message);
      }
    };

    saveBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      save();
    });
    cancelBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      cancel();
    });
    for (const input of [titleInput, groupInput]) {
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("keydown", (event) => {
        event.stopPropagation();
        if (event.key === "Enter" && !event.isComposing) {
          event.preventDefault();
          save();
        } else if (event.key === "Escape") {
          event.preventDefault();
          cancel();
        }
      });
    }
    titleInput.focus();
    titleInput.select();
  }

  /** Wire a header so a dragged conversation can be dropped on it. */
  function makeDropTarget(header, groupName) {
    header.addEventListener("dragover", (event) => {
      if (!draggingSessionId) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      header.classList.add("drop-hover");
    });
    header.addEventListener("dragleave", () => header.classList.remove("drop-hover"));
    header.addEventListener("drop", (event) => {
      event.preventDefault();
      header.classList.remove("drop-hover");
      const dropped = event.dataTransfer.getData("text/plain") || draggingSessionId;
      draggingSessionId = null;
      if (!dropped) return;
      const current = (sessions.find((item) => item.session_id === dropped) || {}).group_name || "";
      if (current === groupName) return;
      moveToGroup(dropped, groupName);
    });
  }

  function groupHeader(name, count) {
    const collapsed = collapsedGroups.has(name);
    const header = document.createElement("div");
    header.className = "conv-group" + (collapsed ? " collapsed" : "");

    const caret = document.createElement("span");
    caret.className = "group-caret";
    caret.textContent = "▾";
    const label = document.createElement("span");
    label.className = "group-label";
    label.textContent = name;
    const badge = document.createElement("span");
    badge.className = "group-count";
    badge.textContent = String(count);

    const more = document.createElement("button");
    more.type = "button";
    more.className = "conv-more group-more";
    more.title = "分组操作";
    more.textContent = "···";
    more.addEventListener("click", (event) => {
      event.stopPropagation();
      if (header.classList.contains("menu-open")) closeConvMenu(header);
      else openGroupMenu(header, name);
    });

    header.append(caret, label, badge, more);
    header.addEventListener("click", () => {
      if (collapsedGroups.has(name)) collapsedGroups.delete(name);
      else collapsedGroups.add(name);
      localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...collapsedGroups]));
      renderConversations();
    });
    makeDropTarget(header, name);
    return header;
  }

  function openGroupMenu(header, name) {
    closeAllConvMenus();
    header.classList.add("menu-open");

    const menu = document.createElement("div");
    menu.className = "conv-menu group-menu";
    menu.addEventListener("click", (event) => event.stopPropagation());

    const renameBtn = document.createElement("button");
    renameBtn.type = "button";
    renameBtn.textContent = "✎ 重命名分组";
    renameBtn.addEventListener("click", () => {
      closeConvMenu(header);
      openGroupRename(header, name);
    });

    const newChatBtn = document.createElement("button");
    newChatBtn.type = "button";
    newChatBtn.textContent = "＋ 在此分组新建对话";
    newChatBtn.addEventListener("click", () => {
      closeConvMenu(header);
      newChatInGroup(name);
    });

    const sep = document.createElement("div");
    sep.className = "menu-sep";

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "danger";
    deleteBtn.textContent = "🗑 删除分组";
    deleteBtn.addEventListener("click", () => {
      closeConvMenu(header);
      removeGroup(name);
    });

    menu.append(renameBtn, newChatBtn, sep, deleteBtn);
    header.appendChild(menu);
  }

  /** Inline rename right in the sidebar header. */
  function openGroupRename(header, name) {
    header.innerHTML = "";
    header.classList.add("editing");
    header.style.cursor = "default";

    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 40;
    input.value = name;
    input.className = "group-rename-input";

    const save = document.createElement("button");
    save.type = "button";
    save.className = "group-save";
    save.textContent = "保存";

    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "group-cancel";
    cancel.textContent = "取消";

    header.append(input, save, cancel);
    input.focus();
    input.select();

    const submit = async () => {
      const next = input.value.trim();
      if (!next || next === name) {
        renderConversations();
        return;
      }
      try {
        const response = await fetch(`/api/groups/${encodeURIComponent(name)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: next }),
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(typeof payload.detail === "string" ? payload.detail : "重命名失败");
        }
        await refreshSessions();
        notify(`分组已重命名为「${next}」`, "ok");
      } catch (error) {
        notify("重命名分组失败：" + error.message);
        renderConversations();
      }
    };

    save.addEventListener("click", (event) => {
      event.stopPropagation();
      submit();
    });
    cancel.addEventListener("click", (event) => {
      event.stopPropagation();
      renderConversations();
    });
    input.addEventListener("click", (event) => event.stopPropagation());
    input.addEventListener("keydown", (event) => {
      event.stopPropagation();
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        submit();
      } else if (event.key === "Escape") {
        event.preventDefault();
        renderConversations();
      }
    });
  }

  /** Start a new conversation that already belongs to a group. */
  async function newChatInGroup(group) {
    const id = newSessionId();
    try {
      const response = await fetch(`/api/sessions/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ group_name: group }),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(typeof payload.detail === "string" ? payload.detail : "创建失败");
      }
    } catch (error) {
      notify("在分组里新建对话失败：" + error.message);
      return;
    }

    sessionId = id;
    persistSession();
    clearAttachments();
    setRewriteMode(false);
    clearTurnActions();
    messagesEl.innerHTML = "";
    showEmptyState();
    await refreshSessions();
    refreshWorkspacePill();
    setStreaming(false);
    closeSidebar();
    inputEl.focus();
    notify(`已在「${group}」里新建对话`, "ok");
  }

  function looseGroupHeader() {
    const header = document.createElement("div");
    header.className = "conv-group";
    header.style.cursor = "default";
    header.innerHTML = '<span class="group-caret">▾</span><span>未分组</span>';
    makeDropTarget(header, "");
    return header;
  }

  function renderConversations() {
    syncGroupOptions();
    convListEl.innerHTML = "";
    if (!sessions.length) {
      const empty = document.createElement("div");
      empty.className = "sidebar-empty";
      empty.textContent = "还没有历史对话";
      convListEl.appendChild(empty);
      return;
    }

    const byGroup = new Map();
    for (const item of sessions) {
      const key = item.group_name || "";
      if (!byGroup.has(key)) byGroup.set(key, []);
      byGroup.get(key).push(item);
    }

    // Every conversation must be reachable, even if its group was deleted.
    const names = new Set(groups.map((group) => group.name));
    for (const key of byGroup.keys()) if (key) names.add(key);

    for (const name of [...names].sort((a, b) => a.localeCompare(b, "zh"))) {
      if (!byGroup.has(name)) byGroup.set(name, []);
      convListEl.appendChild(groupHeader(name, byGroup.get(name).length));
      if (collapsedGroups.has(name)) continue;
      for (const item of byGroup.get(name)) {
        convListEl.appendChild(conversationRow(item));
      }
    }

    const loose = byGroup.get("") || [];
    // Shown whenever groups exist: it is also the drop target for "移出分组".
    if (names.size) convListEl.appendChild(looseGroupHeader());
    for (const item of loose) convListEl.appendChild(conversationRow(item));

    renderTrash();
  }

  /** Small "deleted groups" drawer, pinned under the conversation list. */
  function renderTrash() {
    sidebarTrash.innerHTML = "";
    sidebarTrash.hidden = archivedGroups.length === 0;
    if (!archivedGroups.length) return;

    const header = document.createElement("div");
    header.className = "conv-group trash-header";
    header.innerHTML = `<span class="group-caret${trashOpen ? "" : " collapsed-caret"}">▾</span>
      <span>🗄 已删除的分组</span><span class="group-count">${archivedGroups.length}</span>`;
    header.addEventListener("click", () => {
      trashOpen = !trashOpen;
      renderTrash();
    });
    sidebarTrash.appendChild(header);

    if (!trashOpen) return;
    for (const item of archivedGroups) {
      const row = document.createElement("div");
      row.className = "conv trash-row";
      const label = document.createElement("div");
      label.className = "conv-title";
      label.textContent = item.name;
      const meta = document.createElement("div");
      meta.className = "conv-meta";
      meta.textContent = `${item.count} 个对话可一起恢复`;
      const restore = document.createElement("button");
      restore.type = "button";
      restore.className = "trash-restore";
      restore.textContent = "恢复";
      restore.addEventListener("click", (event) => {
        event.stopPropagation();
        restoreGroup(item.name);
      });
      row.append(label, meta, restore);
      sidebarTrash.appendChild(row);
    }
  }

  async function restoreGroup(name) {
    try {
      const response = await fetch("/api/groups/restore", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(typeof payload.detail === "string" ? payload.detail : "恢复失败");
      }
      const group = await response.json();
      trashOpen = false;
      await refreshSessions();
      notify(`已恢复分组「${group.name}」，${group.count} 个对话归位`, "ok");
    } catch (error) {
      notify("恢复分组失败：" + error.message);
    }
  }

  async function refreshSessions() {
    try {
      const [sessionList, groupList, trash] = await Promise.all([
        fetch("/api/sessions").then((r) => r.json()),
        fetch("/api/groups").then((r) => r.json()),
        fetch("/api/groups/trash").then((r) => r.json()),
      ]);
      sessions = sessionList;
      groups = groupList;
      archivedGroups = trash;
    } catch {
      sessions = [];
      groups = [];
      archivedGroups = [];
    }
    renderConversations();
    await refreshWorkspacePill();
  }

  function syncGroupOptions() {
    groupOptions.innerHTML = "";
    for (const group of groups) {
      const option = document.createElement("option");
      option.value = group.name;
      groupOptions.appendChild(option);
    }
  }

  /* ---- groups ------------------------------------------------------- */
  async function createGroup() {
    const name = groupNameInput.value.trim();
    if (!name) {
      groupNameInput.focus();
      return;
    }
    try {
      const response = await fetch("/api/groups", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(typeof payload.detail === "string" ? payload.detail : "创建失败");
      }
      groupNameInput.value = "";
      groupCreate.hidden = true;
      await refreshSessions();
      notify(`已创建分组「${name}」`, "ok");
    } catch (error) {
      notify("创建分组失败：" + error.message);
    }
  }

  async function removeGroup(name) {
    try {
      const response = await fetch(`/api/groups/${encodeURIComponent(name)}`, {
        method: "DELETE",
      });
      if (!response.ok) throw new Error("删除失败");
      collapsedGroups.delete(name);
      await refreshSessions();
      notify(`已删除分组「${name}」，其中的对话回到未分组`, "ok");
    } catch (error) {
      notify("删除分组失败：" + error.message);
    }
  }

  newGroupBtn.addEventListener("click", () => {
    groupCreate.hidden = !groupCreate.hidden;
    if (!groupCreate.hidden) groupNameInput.focus();
  });
  groupCreateSave.addEventListener("click", createGroup);
  groupCreateCancel.addEventListener("click", () => {
    groupNameInput.value = "";
    groupCreate.hidden = true;
  });
  groupNameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      createGroup();
    } else if (event.key === "Escape") {
      groupCreate.hidden = true;
    }
  });

  /* ------------------------------------------------------------------ *
   * The conversation's own workspace — shown next to the conversation,  *
   * not buried in the global settings panel                             *
   * ------------------------------------------------------------------ */
  let defaultWorkspace = "";

  function baseName(path) {
    if (!path) return "";
    const parts = String(path).split(/[\\/]/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : String(path);
  }

  function currentWorkspaceOverride() {
    const mine = sessions.find((item) => item.session_id === sessionId);
    return (mine && mine.workspace_dir) || "";
  }

  async function refreshWorkspacePill() {
    if (!defaultWorkspace) {
      try {
        const view = await fetch("/api/settings").then((response) => response.json());
        defaultWorkspace = view.workspace_dir || "";
      } catch { /* offline: keep the placeholder generic */ }
    }
    const override = currentWorkspaceOverride();
    wsPill.classList.toggle("own", Boolean(override));
    wsPill.textContent = override
      ? `📁 本对话工作区域：${baseName(override)}`
      : `📁 工作区域：跟随默认（${baseName(defaultWorkspace) || "workspace"}）`;
    wsPill.title = override || defaultWorkspace || "跟随默认";
    wsInput.placeholder = defaultWorkspace
      ? `留空 = 跟随默认（${defaultWorkspace}）`
      : "留空 = 跟随默认";
  }

  function openWorkspaceEditor() {
    wsInput.value = currentWorkspaceOverride();
    wsEditor.hidden = false;
    wsInput.focus();
    wsInput.select();
  }

  function closeWorkspaceEditor() {
    wsEditor.hidden = true;
  }

  async function saveWorkspace(raw) {
    try {
      const response = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ workspace_dir: raw }),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(typeof payload.detail === "string" ? payload.detail : "保存失败");
      }
      closeWorkspaceEditor();
      await refreshSessions();
      notify(raw ? `本对话工作区域已设为 ${raw}` : "本对话已恢复跟随默认工作区域", "ok");
    } catch (error) {
      notify("工作区域保存失败：" + error.message);
    }
  }

  wsPill.addEventListener("click", () => {
    if (wsEditor.hidden) openWorkspaceEditor();
    else closeWorkspaceEditor();
  });
  wsSave.addEventListener("click", () => saveWorkspace(wsInput.value.trim()));
  wsReset.addEventListener("click", () => {
    wsInput.value = "";
    saveWorkspace("");
  });
  wsCancel.addEventListener("click", closeWorkspaceEditor);
  wsInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      saveWorkspace(wsInput.value.trim());
    }
  });

  async function loadHistory(id) {
    messagesEl.innerHTML = "";
    let payload;
    try {
      payload = await fetch(`/api/sessions/${encodeURIComponent(id)}/messages`).then((r) => r.json());
    } catch {
      payload = { messages: [] };
    }
    const messages = payload.messages || [];
    if (!messages.length) {
      showEmptyState();
      return;
    }
    for (const message of messages) {
      if (message.role === "user") {
        userTurn(message.content, message.images || []);
      } else if (message.role === "assistant") {
        paintAssistant(botTurn(), message.content, { interactive: false });
      }
    }
    // A paused tool call is part of the conversation state — restore its prompt.
    const probe = botTurn();
    const restored = await restorePending(probe);
    if (!restored) probe.root.remove();
    scrollToBottom();
    refreshTurnActions();
  }

  async function switchSession(id) {
    // Deliberately NOT aborting the conversation we are leaving: its turn keeps
    // streaming in the background and lands in the stored history when done.
    const leaving = running.get(sessionId);
    sessionId = id;
    persistSession();
    clearAttachments();
    setRewriteMode(false);
    clearTurnActions();
    renderConversations();
    await refreshWorkspacePill();
    closeSidebar();
    await loadHistory(id);

    const active = running.get(id);
    if (active) active.turn.joinedLater = true;
    setStreaming(Boolean(active));
    if (active) notify("这个对话还在生成上一轮，完成后会自动刷新", "ok");
    else if (leaving) notify("上一轮仍在后台继续，完成后会写进历史", "ok");
    inputEl.focus();
  }

  function newChat() {
    // Same rule: leave whatever is running alone.
    sessionId = newSessionId();
    persistSession();
    clearAttachments();
    setRewriteMode(false);
    clearTurnActions();
    messagesEl.innerHTML = "";
    showEmptyState();
    renderConversations();
    refreshWorkspacePill();
    setStreaming(false);
    closeSidebar();
    inputEl.focus();
  }

  async function deleteConversation(id) {
    const active = running.get(id);
    if (active) active.controller.abort(); // the conversation is going away
    try {
      await fetch(`/api/sessions/${encodeURIComponent(id)}`, { method: "DELETE" });
    } catch { /* offline: still update the UI */ }
    if (id === sessionId) newChat();
    await refreshSessions();
  }

  function openSidebar() {
    sidebarEl.classList.add("open");
    backdropEl.classList.add("show");
  }

  function closeSidebar() {
    sidebarEl.classList.remove("open");
    backdropEl.classList.remove("show");
  }

  /* ------------------------------------------------------------------ *
   * Agent options: turn a proposed list into clickable choices          *
   * ------------------------------------------------------------------ */
  const OPTIONS_OPEN = "```options";

  /** Split an answer into display text + the machine-readable option list. */
  function splitOptions(raw) {
    const text = raw || "";
    const start = text.indexOf(OPTIONS_OPEN);
    if (start === -1) return { text, options: [] };
    const bodyStart = text.indexOf("\n", start);
    if (bodyStart === -1) return { text: text.slice(0, start), options: [] };
    const end = text.indexOf("```", bodyStart);
    const body = end === -1 ? text.slice(bodyStart + 1) : text.slice(bodyStart + 1, end);
    const tail = end === -1 ? "" : text.slice(end + 3);
    return { text: (text.slice(0, start) + tail).trim(), options: parseOptions(body) };
  }

  /** While streaming, hide a half-written options block. */
  function visibleAnswer(raw) {
    const index = (raw || "").indexOf(OPTIONS_OPEN);
    return index === -1 ? raw || "" : (raw || "").slice(0, index);
  }

  function parseOptions(body) {
    const trimmed = (body || "").trim();
    if (!trimmed) return [];
    try {
      const parsed = JSON.parse(trimmed);
      if (Array.isArray(parsed)) {
        return parsed
          .map((item) => {
            if (typeof item === "string") return { label: item, value: item };
            if (item && typeof item === "object") {
              const value = item.value ?? item.label ?? "";
              return { label: String(item.label ?? value), value: String(value) };
            }
            return null;
          })
          .filter((item) => item && item.label && item.value)
          .slice(0, 6);
      }
    } catch { /* not JSON — fall back to one option per line */ }
    return trimmed
      .split("\n")
      .map((line) =>
        line
          .replace(/^\s*(?:[-*+]|\d+[.)])\s*/, "")
          .replace(/^["'`]|["'`]$/g, "")
          .trim()
      )
      .filter(Boolean)
      .slice(0, 6)
      .map((line) => ({ label: line, value: line }));
  }

  function paintAssistant(view, raw, { interactive = true } = {}) {
    const { text, options } = splitOptions(raw);
    view.md.innerHTML = text ? renderMarkdown(text) : "";
    if (options.length) renderOptions(view, options, { interactive });
  }

  function renderOptions(view, options, { interactive = true } = {}) {
    const box = document.createElement("div");
    box.className = "options";

    const head = document.createElement("div");
    head.className = "options-head";
    head.textContent = interactive ? "选一个，或自己写一个：" : "当时给出的选项";

    const grid = document.createElement("div");
    grid.className = "options-grid";
    for (const option of options) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.textContent = option.label;
      button.title = option.value;
      button.disabled = !interactive;
      if (interactive) {
        button.addEventListener("click", () => chooseOption(option, button, box));
      }
      grid.appendChild(button);
    }

    box.append(head, grid);

    if (interactive) {
      const custom = document.createElement("div");
      custom.className = "options-custom";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "自定义：写下你想要的做法…";
      const send = document.createElement("button");
      send.type = "button";
      send.textContent = "发送";
      const fire = () => {
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        chooseOption({ label: text, value: text }, null, box);
      };
      send.addEventListener("click", fire);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.isComposing) {
          event.preventDefault();
          fire();
        }
      });
      custom.append(input, send);
      box.appendChild(custom);
    }

    view.stats.after(box);
  }

  /** A click on an option becomes the next user message. */
  function chooseOption(option, button, box) {
    if (streaming) return;
    box.classList.add("chosen");
    box.querySelectorAll(".option").forEach((element) => {
      element.disabled = true;
    });
    box.querySelector(".options-head").textContent = "已选择：";
    if (button) {
      button.classList.add("chosen");
    } else {
      const echo = document.createElement("div");
      echo.className = "option chosen";
      echo.textContent = option.label;
      box.querySelector(".options-grid").appendChild(echo);
    }
    inputEl.value = option.value;
    autoGrow();
    send();
  }

  /* ------------------------------------------------------------------ *
   * Undo / rewrite the last exchange                                   *
   * ------------------------------------------------------------------ */
  let rewriteMode = false;

  function setRewriteMode(on) {
    rewriteMode = on;
    rewriteHint.hidden = !on;
    sendBtn.classList.toggle("stop", on || streaming);
    if (!on) {
      rewriteHint.querySelector("span").textContent =
        "✎ 重写模式：发送后会替换上一轮提问与回答";
    }
  }

  function clearTurnActions() {
    messagesEl.querySelectorAll(".turn-actions").forEach((element) => element.remove());
  }

  /** Locate the last assistant turn and the user turn that produced it. */
  function lastExchange() {
    const turns = Array.from(messagesEl.querySelectorAll(".turn"));
    for (let index = turns.length - 1; index >= 0; index -= 1) {
      if (!turns[index].querySelector(".msg.bot")) continue;
      const hasUser = index > 0 && turns[index - 1].querySelector(".msg.user");
      return {
        botTurnEl: turns[index],
        userTurnEl: hasUser ? turns[index - 1] : null,
      };
    }
    return null;
  }

  function refreshTurnActions() {
    clearTurnActions();
    if (streaming || rewriteMode) return;
    const exchange = lastExchange();
    if (!exchange || !exchange.userTurnEl) return;

    const actions = document.createElement("div");
    actions.className = "turn-actions";

    const undoBtn = document.createElement("button");
    undoBtn.type = "button";
    undoBtn.className = "turn-action";
    undoBtn.textContent = "⟲ 撤回";
    undoBtn.title = "删除最后一轮提问和回答";
    undoBtn.addEventListener("click", doUndo);

    const rewriteBtn = document.createElement("button");
    rewriteBtn.type = "button";
    rewriteBtn.className = "turn-action";
    rewriteBtn.textContent = "✎ 重写";
    rewriteBtn.title = "编辑上一条提问并重新回答";
    rewriteBtn.addEventListener("click", startRewrite);

    actions.append(undoBtn, rewriteBtn);
    exchange.botTurnEl.querySelector(".msg.bot .body").appendChild(actions);
  }

  async function doUndo() {
    try {
      const response = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/undo`, {
        method: "POST",
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.detail || `HTTP ${response.status}`);
      }
      await loadHistory(sessionId);
      await refreshSessions();
    } catch (error) {
      notify("撤回失败：" + error.message);
    }
  }

  function startRewrite() {
    const exchange = lastExchange();
    if (!exchange || !exchange.userTurnEl) return;
    const bubble = exchange.userTurnEl.querySelector(".bubble");
    const textNode = bubble.querySelector(".bubble-text");
    const images = Array.from(bubble.querySelectorAll(".bubble-imgs img")).map(
      (img) => img.src
    );

    clearTurnActions();
    setRewriteMode(true);
    inputEl.value = textNode ? textNode.textContent : "";
    pendingImages = images.map((src, index) => ({
      id: `rewrite-${index}-${Date.now()}`,
      dataUrl: src,
      name: "attachment",
    }));
    renderAttachments();
    autoGrow();
    inputEl.focus();
  }

  async function runRewrite(text, images) {
    // The server truncates before answering, so mirror that locally first.
    const exchange = lastExchange();
    if (exchange) {
      if (exchange.userTurnEl) exchange.userTurnEl.remove();
      exchange.botTurnEl.remove();
    }
    const owner = sessionId;
    userTurn(text, images);
    const turn = createTurn(botTurn());
    setStreaming(true);

    try {
      const answer = await pumpStream(
        `/api/sessions/${encodeURIComponent(owner)}/rewrite`,
        { message: text, images },
        turn
      );
      if (!answer && !turn.awaiting) {
        turn.view.md.innerHTML = '<span style="color:var(--muted)">（本轮没有文本输出）</span>';
      }
    } catch (error) {
      const box = document.createElement("div");
      box.className = "err-box";
      box.textContent = "重写失败：" + error.message;
      turn.view.err.appendChild(box);
      await loadHistory(owner); // fall back to what the server actually stored
    } finally {
      setRewriteMode(false);
      await finishTurn(owner, turn);
      inputEl.focus();
    }
  }

  /* ------------------------------------------------------------------ *
   * Send / stop                                                        *
   * ------------------------------------------------------------------ */
  async function send() {
    const text = inputEl.value.trim();
    const images = pendingImages.map((item) => item.dataUrl);
    if ((!text && !images.length) || isRunning()) return;

    if (rewriteMode) {
      if (!text) {
        notify("重写需要保留一段文字内容");
        return;
      }
      inputEl.value = "";
      autoGrow();
      clearAttachments();
      await runRewrite(text, images);
      return;
    }

    const owner = sessionId;
    inputEl.value = "";
    autoGrow();
    userTurn(text, images);
    clearAttachments();
    const turn = createTurn(botTurn());
    setStreaming(true);

    try {
      const answer = await pumpStream(
        "/api/chat/stream",
        { message: text, images, session_id: owner },
        turn
      );
      if (!answer && !turn.awaiting) {
        turn.view.md.innerHTML = '<span style="color:var(--muted)">（本轮没有文本输出）</span>';
      }
    } catch (error) {
      if (error.name === "AbortError") {
        turn.view.md.innerHTML =
          (turn.view.md.innerHTML.replace(/<span class="cursor"><\/span>/, "") || "") +
          '<p style="color:var(--muted)">已停止。</p>';
      } else {
        const box = document.createElement("div");
        box.className = "err-box";
        box.textContent = "请求失败：" + error.message;
        turn.view.err.appendChild(box);
      }
    } finally {
      // Keep the composer locked while an approval is still pending.
      await finishTurn(owner, turn);
      if (turn.awaiting && owner === sessionId) setStreaming(true);
      inputEl.focus();
    }
  }

  rewriteCancel.addEventListener("click", () => {
    setRewriteMode(false);
    inputEl.value = "";
    autoGrow();
    clearAttachments();
    refreshTurnActions();
  });

  sendBtn.addEventListener("click", () => {
    // Only this conversation's own stream can be stopped from here.
    const active = running.get(sessionId);
    if (active) {
      active.controller.abort();
      return;
    }
    send();
  });

  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      send();
    }
  });

  // Paste a screenshot straight into the composer.
  inputEl.addEventListener("paste", (event) => {
    const items = Array.from(event.clipboardData?.items || []);
    const files = items
      .filter((item) => item.kind === "file")
      .map((item) => item.getAsFile())
      .filter(Boolean);
    if (files.length) {
      event.preventDefault();
      addFiles(files);
    }
  });

  composerEl.addEventListener("dragover", (event) => {
    event.preventDefault();
    composerEl.classList.add("dragging");
  });
  composerEl.addEventListener("dragleave", () => composerEl.classList.remove("dragging"));
  composerEl.addEventListener("drop", (event) => {
    event.preventDefault();
    composerEl.classList.remove("dragging");
    addFiles(event.dataTransfer?.files);
  });

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    await addFiles(fileInput.files);
    fileInput.value = "";
  });

  newChatBtn.addEventListener("click", newChat);
  sidebarToggle.addEventListener("click", openSidebar);
  backdropEl.addEventListener("click", closeSidebar);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeSidebar();
  });

  /* ------------------------------------------------------------------ *
   * Settings panel — server-side config + local UI preferences          *
   * ------------------------------------------------------------------ */
  async function refreshMeta() {
    const [health, tools] = await Promise.all([
      fetch("/api/health").then((r) => r.json()),
      fetch("/api/tools").then((r) => r.json()),
    ]);
    supportsImages = Boolean(health.supports_images);
    attachBtn.disabled = !supportsImages;
    attachBtn.title = supportsImages
      ? "添加图片（也可以直接粘贴或拖进来）"
      : "当前模型不支持图片输入";
    visionBadge.hidden = !supportsImages;

    healthBadge.classList.toggle("warn", !health.ready);
    healthText.textContent = health.ready
      ? `${health.model} · ${health.tool_count} tools`
      : "未配置 API Key（降级模式）";
    healthBadge.title = health.detail || "";
    // Tool names are intentionally not listed on the page; they live in 设置.
    return tools;
  }

  async function openSettings() {
    settingsStatus.textContent = "";
    settingsStatus.classList.remove("error");
    let view;
    try {
      view = await fetch("/api/settings").then((r) => r.json());
    } catch {
      settingsStatus.textContent = "读取配置失败，后端可能没连上";
      settingsStatus.classList.add("error");
      return;
    }

    setApiKey.value = "";
    apiKeyHint.textContent = view.api_key_set
      ? `已配置：${view.api_key_hint}（留空则不修改）`
      : "尚未配置 API Key，填入后保存即可开始真实调用";

    const models = view.available_models.includes(view.model)
      ? view.available_models
      : [view.model, ...view.available_models];
    setModel.innerHTML = models
      .map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
      .join("");
    setModel.value = view.model;
    modelHint.textContent = view.supports_images
      ? "当前模型支持图片输入（多模态）"
      : "当前模型不支持图片，上传入口会被禁用";

    setDownloads.value = view.downloads_dir;
    setWorkspace.value = view.workspace_dir;

    setTools.innerHTML = "";
    for (const tool of view.tools) {
      const label = document.createElement("label");
      label.className = "tool-toggle";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.value = tool.name;
      box.checked = tool.enabled !== false;
      const text = document.createElement("span");
      text.textContent = `${tool.icon} ${tool.label}`;
      label.title = tool.description;
      label.append(box, text);
      setTools.appendChild(label);
    }

    setFont.value = String(prefs.font);
    fontValue.textContent = `${prefs.font}px`;
    applyPrefs();
    settingsModal.hidden = false;
  }

  function closeSettings() {
    settingsModal.hidden = true;
  }

  async function saveSettings() {
    const patch = {
      model: setModel.value,
      enabled_tools: Array.from(setTools.querySelectorAll("input:checked")).map((i) => i.value),
    };
    if (setApiKey.value.trim()) patch.api_key = setApiKey.value.trim();
    if (setDownloads.value.trim()) patch.downloads_dir = setDownloads.value.trim();
    if (setWorkspace.value.trim()) patch.workspace_dir = setWorkspace.value.trim();

    settingsSave.disabled = true;
    settingsStatus.classList.remove("error");
    settingsStatus.textContent = "保存中…（会按新配置重建 Agent）";
    try {
      const response = await fetch("/api/settings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(typeof payload.detail === "string" ? payload.detail : "保存失败");
      }
      const view = await response.json();
      apiKeyHint.textContent = view.api_key_set
        ? `已配置：${view.api_key_hint}（留空则不修改）`
        : "尚未配置 API Key";
      modelHint.textContent = view.supports_images
        ? "当前模型支持图片输入（多模态）"
        : "当前模型不支持图片，上传入口会被禁用";
      setDownloads.value = view.downloads_dir;
      setWorkspace.value = view.workspace_dir;

      defaultWorkspace = view.workspace_dir || "";
      settingsStatus.textContent = "✅ 已保存，Agent 已重建";
      await refreshMeta();
      await refreshWorkspacePill();
    } catch (error) {
      settingsStatus.textContent = "❌ " + error.message;
      settingsStatus.classList.add("error");
    } finally {
      settingsSave.disabled = false;
    }
  }

  settingsBtn.addEventListener("click", openSettings);
  settingsClose.addEventListener("click", closeSettings);
  settingsBackdrop.addEventListener("click", closeSettings);
  settingsSave.addEventListener("click", saveSettings);

  setFont.addEventListener("input", () => {
    prefs.font = Number(setFont.value);
    fontValue.textContent = `${prefs.font}px`;
    applyPrefs();
    savePrefs();
  });

  themeRow.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-theme]");
    if (!button) return;
    prefs.theme = button.dataset.theme;
    applyPrefs();
    savePrefs();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    closeAllConvMenus();
    if (!settingsModal.hidden) closeSettings();
  });

  // Any click outside the ··· menu closes it.
  document.addEventListener("click", (event) => {
    if (!event.target.closest || !event.target.closest(".conv-menu")) closeAllConvMenus();
  });

  /* ------------------------------------------------------------------ *
   * Boot                                                               *
   * ------------------------------------------------------------------ */
  async function boot() {
    loadPrefs();
    applyPrefs();
    showEmptyState();
    try {
      await refreshMeta();
    } catch {
      healthBadge.classList.add("err");
      healthText.textContent = "后端未连接";
    }

    await refreshSessions();
    // Only restore a conversation the server still knows about.
    if (sessions.some((item) => item.session_id === sessionId)) {
      await loadHistory(sessionId);
    }
  }

  boot();
})();
</script>
</body>
</html>
