<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSeek Tool Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐳</text></svg>" />
<style>
  :root {
    --bg: #080c17;
    --bg-soft: #0d1324;
    --panel: #121b30;
    --panel-2: #16203a;
    --border: #24314f;
    --border-soft: #1b2540;
    --text: #e8edf8;
    --muted: #8b9ac0;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.14);
    --ok: #2fbf8f;
    --warn: #e6a23c;
    --err: #f0616d;
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(91, 140, 255, 0.16), transparent 60%),
      radial-gradient(900px 480px at 92% 4%, rgba(47, 191, 143, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size, 15px);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- light theme (settings → 界面配色) ---------- */
  body[data-theme="light"] {
    --bg: #f5f8fd;
    --bg-soft: #eef3fa;
    --panel: #ffffff;
    --panel-2: #f1f6fc;
    --border: #d5dfee;
    --border-soft: #e3eaf5;
    --text: #172034;
    --muted: #5c6b86;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.10);
    --ok: #0f9d76;
    --warn: #b7791f;
    --err: #d9444f;
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(37, 99, 235, 0.10), transparent 60%),
      radial-gradient(900px 480px at 92% 4%, rgba(15, 157, 118, 0.08), transparent 55%),
      var(--bg);
  }
  body[data-theme="light"] .md code { background: #eaf0fa; color: #1e3a8a; }
  body[data-theme="light"] .md pre { background: #f4f7fc; }
  body[data-theme="light"] .md pre code { color: #1e293b; }
  body[data-theme="light"] .tool-body pre { color: #24304a; }
  body[data-theme="light"] .think { background: rgba(37, 99, 235, 0.05); }
  body[data-theme="light"] .conv:hover { background: var(--panel-2); }
  body[data-theme="light"] .conv-meta { color: #7d8aa3; }
  body[data-theme="light"] .thumb button { background: rgba(23, 32, 52, 0.75); }
  /* Full-bleed shell: the sidebar hugs the left edge, only the reading column is
     width-limited (and centred) inside .main-col. */
  .shell { display: flex; height: 100vh; width: 100%; }
  .main-col { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  header > *,
  main > *,
  .composer-wrap > * { width: 100%; max-width: 940px; margin-left: auto; margin-right: auto; }

  /* ---------- settings button (deliberately prominent) ---------- */
  .settings-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 15px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 550;
    color: #dbe6ff; border: 1px solid rgba(91, 140, 255, .55);
    background: linear-gradient(135deg, rgba(91, 140, 255, .28), rgba(91, 140, 255, .12));
    box-shadow: 0 2px 10px rgba(91, 140, 255, .18);
    transition: filter .15s, transform .1s, border-color .15s;
  }
  .settings-btn:hover { filter: brightness(1.15); border-color: var(--accent); }
  .settings-btn:active { transform: scale(.98); }
  .settings-btn .gear { font-size: 14px; }
  body[data-theme="light"] .settings-btn {
    color: #1d4ed8;
    border-color: rgba(37, 99, 235, .45);
    background: linear-gradient(135deg, rgba(37, 99, 235, .18), rgba(37, 99, 235, .06));
  }

  /* ---------- conversation bar: workspace pill ---------- */
  #conv-bar { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .ws-pill {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; color: var(--muted);
    border: 1px solid var(--border); background: var(--bg-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .15s, border-color .15s;
  }
  .ws-pill:hover { color: var(--text); border-color: var(--accent); }
  .ws-pill.own { color: #b9cdff; border-color: rgba(91, 140, 255, .5); background: var(--accent-soft); }
  body[data-theme="light"] .ws-pill.own { color: #1d4ed8; }
  .ws-editor { display: flex; gap: 8px; align-items: center; margin-top: 9px; flex-wrap: wrap; }
  .ws-editor[hidden] { display: none; }
  .ws-editor input {
    flex: 1; min-width: 200px; padding: 6px 11px; border-radius: 9px; font-size: 12.5px;
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); outline: none;
  }
  .ws-editor input:focus { border-color: var(--accent); }
  .ws-editor button {
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--muted);
  }
  .ws-editor button:hover { color: var(--text); border-color: var(--accent); }
  .ws-editor .ws-save {
    background: linear-gradient(135deg, #5b8cff, #4a7bf0); color: #fff; border: none; font-weight: 550;
  }

  /* ---------- agent options (let the user pick) ---------- */
  .options {
    margin-top: 10px; border: 1px solid var(--border-soft); border-radius: 11px;
    padding: 10px 12px; background: var(--bg-soft);
  }
  .options-head { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .options-grid { display: flex; flex-direction: column; gap: 7px; }
  .option {
    text-align: left; padding: 9px 13px; border-radius: 9px; cursor: pointer;
    font-family: inherit; font-size: 13px; color: var(--text);
    border: 1px solid var(--border); background: var(--panel);
    transition: border-color .12s, background .12s, transform .1s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-2); transform: translateX(2px); }
  .option:disabled { opacity: .55; cursor: default; }
  .option.chosen { border-color: var(--ok); color: var(--ok); }
  .options.chosen .options-grid .option:not(.chosen) { display: none; }
  .options-custom { display: flex; gap: 8px; margin-top: 9px; }
  .options-custom input {
    flex: 1; padding: 8px 11px; border-radius: 9px; font-size: 12.8px; font-family: inherit;
    background: var(--panel); border: 1px solid var(--border); color: var(--text); outline: none;
  }
  .options-custom input:focus { border-color: var(--accent); }
  .options-custom button {
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 9px; padding: 8px 14px; font-size: 12.8px; cursor: pointer; font-family: inherit;
  }
  .options-custom button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  .options.chosen .options-custom { display: none; }

  /* ---------- per-turn actions (undo / rewrite) ---------- */  .turn-actions { display: flex; gap: 8px; margin-top: 8px; }
  .turn-action {
    border: 1px solid var(--border-soft); background: var(--bg-soft); color: var(--muted);
    border-radius: 8px; padding: 4px 11px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: color .15s, border-color .15s;
  }
  .turn-action:hover { color: var(--text); border-color: var(--accent); }
  .rewrite-hint {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 2px 9px; padding: 7px 12px; border-radius: 9px; font-size: 12.5px;
    color: #f0c675; background: rgba(230, 162, 60, .10);
    border: 1px solid rgba(230, 162, 60, .40);
  }
  .rewrite-hint[hidden] { display: none; }
  .rewrite-hint button {
    border: 1px solid rgba(230, 162, 60, .5); background: transparent; color: #f0c675;
    border-radius: 7px; padding: 2px 9px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  body[data-theme="light"] .rewrite-hint { color: #92610a; background: rgba(230, 162, 60, .12); }
  body[data-theme="light"] .rewrite-hint button { color: #92610a; }

  /* ---------- conversation sidebar ---------- */
  .sidebar {
    width: 258px; flex: 0 0 258px; display: flex; flex-direction: column; gap: 10px;
    padding: 16px 12px; border-right: 1px solid var(--border-soft); min-height: 0;
  }
  .new-chat {
    width: 100%; padding: 9px 12px; border-radius: 10px; cursor: pointer;
    background: var(--accent-soft); border: 1px solid rgba(91, 140, 255, .38);
    color: #cfdcff; font-size: 13.5px; font-weight: 550; font-family: inherit;
    transition: background .15s, border-color .15s;
  }
  .new-chat:hover { background: rgba(91, 140, 255, .22); border-color: var(--accent); }
  .sidebar-actions { display: flex; gap: 7px; }
  .sidebar-actions .new-chat { flex: 1; width: auto; }
  .new-group {
    flex: 0 0 auto; padding: 9px 11px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; color: var(--muted);
    border: 1px solid var(--border); background: var(--bg-soft);
    transition: color .15s, border-color .15s;
  }
  .new-group:hover { color: var(--text); border-color: var(--accent); }
  .group-create { display: flex; gap: 6px; }
  .group-create[hidden] { display: none; }
  .group-create input {
    flex: 1; min-width: 0; padding: 6px 9px; border-radius: 8px; font-size: 12.5px;
    font-family: inherit; background: var(--bg-soft); border: 1px solid var(--border);
    color: var(--text); outline: none;
  }
  .group-create input:focus { border-color: var(--accent); }
  .group-create button {
    border-radius: 8px; padding: 6px 9px; font-size: 12px; cursor: pointer;
    font-family: inherit; border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--muted);
  }
  .group-create button:hover { color: var(--text); border-color: var(--accent); }
  .conv-group {
    position: relative;
    display: flex; align-items: center; gap: 6px; padding: 6px 8px 4px;
    font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none;
    letter-spacing: .3px;
  }
  .conv-group:hover { color: var(--text); }
  .conv-group .group-caret { font-size: 9px; transition: transform .15s; }
  .conv-group.collapsed .group-caret { transform: rotate(-90deg); }
  .conv-group .group-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;
  }
  .conv-group .group-count { color: #5f7091; }
  .conv-group .group-more { margin-left: auto; }
  .conv-group:hover .conv-more, .conv-group.menu-open .conv-more { opacity: 1; }
  .conv-group.editing { cursor: default; gap: 4px; }
  .group-rename-input {
    flex: 1; min-width: 0; padding: 3px 7px; border-radius: 6px; font-size: 12px;
    font-family: inherit; background: var(--bg); border: 1px solid var(--accent);
    color: var(--text); outline: none;
  }
  .group-save, .group-cancel {
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--muted);
    border-radius: 6px; padding: 2px 7px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .group-save { background: linear-gradient(135deg, #5b8cff, #4a7bf0); color: #fff; border: none; }
  .group-save:hover, .group-cancel:hover { filter: brightness(1.1); }

  /* ---------- deleted groups (recycle bin, pinned under the list) ---------- */
  .sidebar-trash {
    flex: 0 0 auto; border-top: 1px solid var(--border-soft); padding-top: 6px;
    max-height: 40vh; overflow-y: auto;
  }
  .sidebar-trash[hidden] { display: none; }
  .trash-header { margin-top: 0; }
  .trash-header .collapsed-caret { display: inline-block; transform: rotate(-90deg); }
  .trash-row { cursor: default; padding: 6px 58px 6px 10px; }
  .trash-restore {
    position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--muted);
    border-radius: 7px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .trash-restore:hover { color: var(--text); border-color: var(--accent); }
  .conv-more {
    flex: 0 0 auto; width: 20px; height: 18px; border: none; border-radius: 6px;
    cursor: pointer; background: transparent; color: #61729a; font-size: 13px;
    line-height: 1; letter-spacing: 1px; padding: 0; opacity: 0;
    transition: opacity .12s, background .12s, color .12s;
  }
  .conv:hover .conv-more, .conv.menu-open .conv-more { opacity: 1; }
  .conv-more:hover { background: rgba(91, 140, 255, .18); color: var(--accent); }
  .conv.dragging { opacity: .45; }
  .conv.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .conv-group.drop-hover {
    background: var(--accent-soft); color: var(--text); border-radius: 8px;
  }
  .conv-group.drop-hover::after {
    content: "放开即移入"; margin-left: auto; font-size: 10.5px; color: var(--accent);
  }
  .conv-menu {
    position: absolute; right: 6px; top: calc(100% - 4px); z-index: 25;
    min-width: 168px; padding: 5px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .38);
  }
  .group-menu { left: 6px; right: auto; }
  .conv-menu button {
    display: block; width: 100%; text-align: left; padding: 7px 10px; border: none;
    border-radius: 7px; background: transparent; color: var(--text); font-family: inherit;
    font-size: 12.8px; cursor: pointer;
  }
  .conv-menu button:hover { background: var(--panel-2); }
  .conv-menu button.danger { color: var(--err); }
  .conv-menu .menu-label {
    padding: 6px 10px 3px; font-size: 11px; color: var(--muted); letter-spacing: .3px;
  }
  .conv-menu .menu-sep { height: 1px; margin: 4px 2px; background: var(--border-soft); }
  .conv-menu input {
    width: calc(100% - 8px); margin: 4px; padding: 6px 8px; border-radius: 7px;
    font-size: 12.5px; font-family: inherit; background: var(--bg-soft);
    border: 1px solid var(--border); color: var(--text); outline: none;
  }
  .conv-menu input:focus { border-color: var(--accent); }
  .conv-editor { display: flex; flex-direction: column; gap: 5px; }
  .conv-editor input {
    width: 100%; padding: 5px 8px; border-radius: 7px; font-size: 12.5px;
    font-family: inherit; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); outline: none;
  }
  .conv-editor input:focus { border-color: var(--accent); }
  .conv-editor-actions { display: flex; gap: 5px; }
  .conv-editor-actions button {
    flex: 1; border-radius: 7px; padding: 4px 0; font-size: 12px; cursor: pointer;
    font-family: inherit; border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--muted);
  }
  .conv-editor-actions .save { background: linear-gradient(135deg,#5b8cff,#4a7bf0); color: #fff; border: none; }
  .conv-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .conv-list::-webkit-scrollbar { width: 8px; }
  .conv-list::-webkit-scrollbar-thumb { background: #1d2947; border-radius: 8px; }
  .conv {
    position: relative; padding: 8px 11px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; transition: background .12s, border-color .12s;
  }
  .conv:hover { background: var(--panel); }
  .conv.active { background: var(--accent-soft); border-color: rgba(91, 140, 255, .35); }
  /* Title and the ··· button share one line; the title truncates, not wraps. */
  .conv-head { display: flex; align-items: center; gap: 4px; }
  .conv-title {
    flex: 1 1 auto; min-width: 0;
    font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.45;
  }
  .conv.active .conv-title { color: #dbe6ff; }
  .conv-meta { font-size: 11px; color: #61729a; margin-top: 1px; }
  .sidebar-foot { font-size: 11px; color: #4f5f82; line-height: 1.5; }
  .sidebar-empty { font-size: 12.5px; color: #51628a; padding: 12px 4px; text-align: center; }
  .backdrop { display: none; }

  /* ---------- image attachments ---------- */
  .attachments { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 2px 9px; }
  .attachments[hidden] { display: none; }
  .thumb {
    position: relative; width: 62px; height: 62px; border-radius: 9px; overflow: hidden;
    border: 1px solid var(--border); background: var(--panel-2);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 2px; right: 2px; width: 17px; height: 17px; border-radius: 50%;
    border: none; cursor: pointer; background: rgba(8, 12, 23, .82); color: #dbe6ff;
    font-size: 11px; line-height: 17px; padding: 0; text-align: center;
  }
  .thumb button:hover { background: var(--err); color: #fff; }
  .bubble-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .bubble-imgs img {
    max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border);
    display: block; cursor: zoom-in;
  }
  .attach {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px;
    display: grid; place-items: center; flex: 0 0 34px; align-self: flex-end;
    transition: color .15s, border-color .15s;
  }
  .attach:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  .attach:disabled { opacity: .45; cursor: not-allowed; }
  .composer.dragging { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #sidebar-toggle { display: none; }

  /* ---------- approval gate ---------- */
  .approval {
    border: 1px solid rgba(230, 162, 60, 0.55); background: rgba(230, 162, 60, 0.09);
    border-radius: 11px; padding: 11px 13px; margin-bottom: 10px;
  }
  .approval-head { font-size: 13.5px; font-weight: 550; color: #f0c675; margin-bottom: 5px; }
  body[data-theme="light"] .approval-head { color: #92610a; }
  .approval-args {
    font-family: var(--mono); font-size: 12.2px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; margin-bottom: 9px;
  }
  .approval-actions { display: flex; gap: 8px; }
  .approval button {
    border-radius: 8px; padding: 6px 15px; font-size: 13px; cursor: pointer;
    font-family: inherit; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); transition: filter .15s, border-color .15s;
  }
  .approval button.approve { background: linear-gradient(135deg, #2fbf8f, #24a37a); color: #04231a; border: none; font-weight: 600; }
  .approval button.approve:hover { filter: brightness(1.08); }
  .approval button.reject:hover { border-color: var(--err); color: var(--err); }
  .approval.done { border-color: var(--border-soft); background: transparent; }
  .approval.done .approval-actions { display: none; }
  .approval-verdict { font-size: 12.5px; color: var(--muted); }
  .download-link {
    display: inline-flex; align-items: center; gap: 6px; margin: 8px 12px 11px;
    padding: 6px 13px; border-radius: 8px; font-size: 13px; text-decoration: none;
    border: 1px solid rgba(91, 140, 255, .5); background: var(--accent-soft); color: #b9cdff;
  }
  body[data-theme="light"] .download-link { color: #1d4ed8; }
  .download-link:hover { filter: brightness(1.1); }

  /* ---------- settings modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; }
  .modal[hidden] { display: none; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(3, 6, 14, .66); }
  .modal-card {
    position: relative; width: min(560px, calc(100vw - 32px)); max-height: 86vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45); display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border-soft);
  }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-head button {
    border: none; background: transparent; color: var(--muted); font-size: 17px;
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .modal-head button:hover { color: var(--text); }
  .modal-body { padding: 6px 20px 14px; }
  .setting { padding: 13px 0; border-bottom: 1px solid var(--border-soft); }
  .setting:last-child { border-bottom: none; }
  .setting > label { display: block; font-size: 13px; color: var(--text); margin-bottom: 7px; font-weight: 550; }
  .setting .field-hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .setting input[type="text"], .setting input[type="password"], .setting select {
    width: 100%; padding: 8px 11px; border-radius: 9px; font-family: inherit; font-size: 13.5px;
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); outline: none;
  }
  .setting input:focus, .setting select:focus { border-color: var(--accent); }
  .tool-toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; }
  .tool-toggle {
    display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;
    padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border-soft); background: var(--bg-soft);
  }
  .tool-toggle input { accent-color: var(--accent); cursor: pointer; }
  .font-row { display: flex; align-items: center; gap: 12px; }
  .font-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .font-value { font-family: var(--mono); font-size: 12.5px; color: var(--muted); min-width: 46px; text-align: right; }
  .theme-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .theme-row button {
    flex: 1; min-width: 92px; padding: 8px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--muted);
    font-family: inherit; font-size: 13px;
  }
  .theme-row button.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .modal-foot {
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 12px 20px 16px; border-top: 1px solid var(--border-soft);
  }
  .modal-foot .save-hint { margin-right: auto; font-size: 12px; color: var(--muted); }
  .modal-foot .save-hint.error { color: var(--err); }
  button.primary {
    border: none; border-radius: 9px; padding: 8px 20px; font-size: 13.5px; font-weight: 550;
    background: linear-gradient(135deg, #5b8cff, #4a7bf0); color: #fff; cursor: pointer; font-family: inherit;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- header ---------- */
  header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border-soft);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5b8cff, #2fbf8f); font-size: 17px;
    box-shadow: 0 6px 20px rgba(91, 140, 255, 0.35);
  }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.2px; }
  .brand .sub { color: var(--muted); font-size: 12px; margin-left: 2px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); background: var(--panel);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .badge.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .badge.err .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .tools { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 8px;
    border: 1px solid var(--border-soft); background: var(--bg-soft); color: var(--muted);
    display: inline-flex; gap: 6px; align-items: center;
  }
  button.ghost {
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  button.ghost:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- messages ---------- */
  main { flex: 1; overflow-y: auto; padding: 22px 22px 8px; scroll-behavior: smooth; }
  main::-webkit-scrollbar { width: 9px; }
  main::-webkit-scrollbar-thumb { background: #1d2947; border-radius: 8px; }

  .empty { margin: 8vh auto 0; text-align: center; max-width: 560px; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 19px; margin: 14px 0 6px; }
  .empty p { font-size: 13.5px; margin: 0 0 20px; }
  .examples { display: grid; gap: 9px; text-align: left; }
  .example {
    padding: 11px 14px; border-radius: 11px; border: 1px solid var(--border-soft);
    background: var(--panel); color: var(--text); font-size: 13.5px; cursor: pointer;
    transition: border-color .15s, transform .12s, background .15s;
  }
  .example:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-1px); }
  .example span { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }

  .turn { margin-bottom: 22px; }
  .msg { display: flex; gap: 11px; margin-bottom: 14px; }
  .msg .avatar {
    width: 28px; height: 28px; border-radius: 9px; flex: 0 0 28px;
    display: grid; place-items: center; font-size: 14px; margin-top: 2px;
  }
  .msg.user .avatar { background: #22304d; }
  .msg.bot .avatar { background: linear-gradient(135deg, #2b3f6b, #1c2a45); }
  .msg .body { flex: 1; min-width: 0; }
  .msg.user .bubble {
    background: var(--panel-2); border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word;
  }
  .who { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; letter-spacing: .3px; }

  /* ---------- markdown ---------- */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 16px 0 8px; line-height: 1.35; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(91,140,255,.35); }
  .md a:hover { border-bottom-color: var(--accent); }
  .md code {
    font-family: var(--mono); font-size: 12.8px; background: #1a2440;
    padding: 1.5px 5px; border-radius: 5px; color: #cfe0ff;
  }
  .md pre {
    background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
  }
  .md pre code { background: none; padding: 0; color: #cfe0ff; font-size: 12.8px; line-height: 1.6; }
  .md blockquote {
    margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .md table { border-collapse: collapse; margin: 0 0 12px; font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--border-soft); padding: 5px 10px; text-align: left; }
  .md th { background: var(--panel); }
  .md hr { border: none; border-top: 1px solid var(--border-soft); margin: 16px 0; }
  .cursor {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- tool timeline ---------- */
  .trace { margin: 0 0 10px; display: grid; gap: 6px; }
  .tool {
    border: 1px solid var(--border-soft); border-radius: 11px;
    background: var(--panel); overflow: hidden; font-size: 13px;
  }
  .tool.running { border-color: rgba(91, 140, 255, 0.45); }
  .tool.error { border-color: rgba(240, 97, 109, 0.45); }
  .tool-head {
    display: flex; align-items: center; gap: 9px; padding: 8px 12px;
    cursor: pointer; user-select: none;
  }
  .tool-head:hover { background: var(--panel-2); }
  .tool-icon { font-size: 14px; }
  .tool-name { font-weight: 550; }
  .tool-status { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tool.running .tool-status { color: var(--accent); border-color: rgba(91,140,255,.4); }
  .tool.ok .tool-status { color: var(--ok); border-color: rgba(47,191,143,.4); }
  .tool.error .tool-status { color: var(--err); border-color: rgba(240,97,109,.4); }
  .tool.rejected .tool-status { color: var(--warn); border-color: rgba(230,162,60,.45); }
  .tool-elapsed { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .tool-caret { color: var(--muted); font-size: 10px; transition: transform .15s; }
  .tool.open .tool-caret { transform: rotate(90deg); }
  .tool-body { display: none; border-top: 1px solid var(--border-soft); padding: 9px 12px 11px; }
  .tool.open .tool-body { display: block; }
  .tool-label { font-size: 11px; color: var(--muted); letter-spacing: .4px; margin: 6px 0 3px; text-transform: uppercase; }
  .tool-body pre {
    margin: 0; font-family: var(--mono); font-size: 12.2px; white-space: pre-wrap;
    word-break: break-word; color: #c9d6f0; max-height: 260px; overflow: auto;
  }
  .spinner {
    width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(91,140,255,.25);
    border-top-color: var(--accent); animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats {
    display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted);
    font-family: var(--mono); padding: 2px 0 0;
  }
  /* ---------- reasoning (deepseek-reasoner) ---------- */
  .think {
    border: 1px dashed var(--border); border-radius: 10px; padding: 7px 12px;
    margin-bottom: 10px; background: rgba(91, 140, 255, 0.05);
    font-size: 12.8px; color: var(--muted);
  }
  .think-head { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .think-caret { font-size: 10px; transition: transform .15s; }
  .think.open .think-caret { transform: rotate(180deg); }
  .think-body {
    display: none; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border-soft);
    white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto;
    line-height: 1.6;
  }
  .think.open .think-body { display: block; }
  .think-count { font-family: var(--mono); font-size: 11px; opacity: .8; }
  .stats b { color: #b9c8e8; font-weight: 550; }
  .err-box {
    border: 1px solid rgba(240,97,109,.4); background: rgba(240,97,109,.08);
    color: #ffb3b9; border-radius: 10px; padding: 9px 13px; font-size: 13px;
  }
  .err-box.ok {
    border-color: rgba(47,191,143,.45); background: rgba(47,191,143,.10); color: #9fe6c8;
  }
  body[data-theme="light"] .err-box { color: #b42318; }
  body[data-theme="light"] .err-box.ok { color: #0b7a58; }

  /* ---------- composer ---------- */
  .composer-wrap { padding: 10px 22px 20px; }
  .composer {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 15px;
    padding: 10px 10px 10px 15px; transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.55;
    max-height: 180px; min-height: 24px; padding: 3px 0;
  }
  .composer textarea::placeholder { color: #5b6b8f; }
  .send {
    border: none; border-radius: 11px; padding: 9px 17px; font-size: 13.5px; font-weight: 550;
    background: linear-gradient(135deg, #5b8cff, #4a7bf0); color: #fff; cursor: pointer;
    transition: filter .15s, transform .1s; white-space: nowrap;
  }
  .send:hover:not(:disabled) { filter: brightness(1.08); }
  .send:active:not(:disabled) { transform: scale(.97); }
  .send:disabled { opacity: .55; cursor: not-allowed; }
  .send.stop { background: linear-gradient(135deg, #f0616d, #d94a56); }
  .hint { text-align: center; font-size: 11.5px; color: #4f5f82; margin-top: 9px; }
  .hint a { color: #6b7fa8; text-decoration: none; }
  .hint a:hover { color: var(--accent); }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 40;
      width: 272px; flex-basis: 272px; background: var(--bg-soft);
      border-right: 1px solid var(--border); transform: translateX(-104%);
      transition: transform .2s ease;
    }
    .sidebar.open { transform: none; }
    #sidebar-toggle { display: grid; }
    .backdrop {
      display: block; position: fixed; inset: 0; z-index: 30;
      background: rgba(3, 6, 14, .62); opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }
  }

  @media (max-width: 620px) {
    main { padding: 16px 14px 6px; }
    .composer-wrap { padding: 8px 14px 14px; }
    header { padding: 14px 14px 11px; }
    .brand h1 { font-size: 15px; }
    .bubble-imgs img { max-width: 150px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-actions">
      <button class="new-chat" id="new-chat-btn">＋ 新对话</button>
      <button class="new-group" id="new-group-btn" title="新建分组">🗂 分组</button>
    </div>
    <div class="group-create" id="group-create" hidden>
      <input id="group-name-input" type="text" maxlength="40" placeholder="分组名称" />
      <button id="group-create-save" type="button">创建</button>
      <button id="group-create-cancel" type="button">取消</button>
    </div>
    <div class="conv-list" id="conv-list"></div>
    <div class="sidebar-trash" id="sidebar-trash" hidden></div>
    <datalist id="group-options"></datalist>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main-col">
    <header>
      <div class="header-row">
        <div class="brand">
          <button class="ghost" id="sidebar-toggle" title="会话列表">☰</button>
          <div class="logo">🐳</div>
          <div>
            <h1>DeepSeek Tool Agent <span class="sub">LangChain · FastAPI · SSE</span></h1>
          </div>
        </div>
        <div class="badges">
          <span class="badge" id="vision-badge" hidden><span class="dot"></span>多模态</span>
          <span class="badge" id="health-badge"><span class="dot"></span><span id="health-text">连接中…</span></span>
          <button class="settings-btn" id="settings-btn" title="设置（模型 / 工具 / 工作区域 / 外观）">
            <span class="gear">⚙</span> 设置
          </button>
        </div>
      </div>
      <div class="tools" id="conv-bar">
        <button class="ws-pill" id="ws-pill" title="设置本对话使用的工作区域">
          📁 工作区域：跟随默认
        </button>
      </div>
      <div class="ws-editor" id="ws-editor" hidden>
        <input id="ws-input" type="text" placeholder="留空 = 跟随默认" />
        <button class="ws-save" id="ws-save" type="button">保存</button>
        <button class="ws-reset" id="ws-reset" type="button">恢复默认</button>
        <button class="ws-cancel" id="ws-cancel" type="button">取消</button>
      </div>
    </header>

    <main id="messages"></main>

    <div class="composer-wrap" id="composer-wrap">
      <div class="attachments" id="attachments" hidden></div>
      <div class="rewrite-hint" id="rewrite-hint" hidden>
        <span>✎ 重写模式：发送后会替换上一轮提问与回答</span>
        <button id="rewrite-cancel" type="button">取消</button>
      </div>
      <div class="composer" id="composer">
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        <button class="attach" id="attach-btn" title="添加图片（也可以直接粘贴或拖进来）">🖼</button>
        <textarea id="input" rows="1" placeholder="问点什么，或者把截图拖进来让我读图…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send-btn">发送</button>
      </div>
      <div class="hint">流式输出 · 工具调用可视化 · 多模态读图 · <a href="/docs" target="_blank" rel="noopener">API 文档</a></div>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal" hidden>
  <div class="modal-backdrop" id="settings-backdrop"></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2>设置</h2>
      <button id="settings-close" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting">
        <label for="set-api-key">DeepSeek API Key</label>
        <input id="set-api-key" type="password" autocomplete="off" placeholder="sk-...（留空则不修改）" />
        <div class="field-hint" id="api-key-hint">—</div>
      </div>
      <div class="setting">
        <label for="set-model">模型</label>
        <select id="set-model"></select>
        <div class="field-hint" id="model-hint">—</div>
      </div>
      <div class="setting">
        <label for="set-downloads">下载文件夹</label>
        <input id="set-downloads" type="text" placeholder="data/downloads" />
        <div class="field-hint">Agent 下载的文件会存到这里；改完对新下载生效。</div>
      </div>
      <div class="setting">
        <label for="set-workspace">工作区域（默认，Agent 只能读写这里）</label>
        <input id="set-workspace" type="text" placeholder="workspace" />
        <div class="field-hint">新的对话默认使用这个目录；越界路径一律拒绝。</div>
      </div>
      <div class="setting">
        <label>工具开关</label>
        <div class="tool-toggles" id="set-tools"></div>
        <div class="field-hint">关掉的工具不会再交给模型，保存后 Agent 会重新编译。</div>
      </div>
      <div class="setting">
        <label for="set-font">界面字号</label>
        <div class="font-row">
          <input id="set-font" type="range" min="13" max="19" step="1" />
          <span class="font-value" id="font-value">15px</span>
        </div>
      </div>
      <div class="setting">
        <label>界面配色</label>
        <div class="theme-row" id="theme-row">
          <button data-theme="dark">深色</button>
          <button data-theme="light">浅色</button>
          <button data-theme="auto">跟随系统</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <span class="save-hint" id="settings-status"></span>
      <button class="primary" id="settings-save">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (sel) => document.querySelector(sel);
  const messagesEl = $("#messages");
  const inputEl = $("#input");
  const sendBtn = $("#send-btn");
  const healthBadge = $("#health-badge");
  const healthText = $("#health-text");
  const visionBadge = $("#vision-badge");
  const convListEl = $("#conv-list");
  const sidebarTrash = $("#sidebar-trash");
  const newChatBtn = $("#new-chat-btn");
  const newGroupBtn = $("#new-group-btn");
  const groupCreate = $("#group-create");
  const groupNameInput = $("#group-name-input");
  const groupCreateSave = $("#group-create-save");
  const groupCreateCancel = $("#group-create-cancel");
  const groupOptions = $("#group-options");
  const sidebarEl = $("#sidebar");
  const sidebarToggle = $("#sidebar-toggle");
  const backdropEl = $("#backdrop");
  const attachBtn = $("#attach-btn");
  const fileInput = $("#file-input");
  const attachmentsEl = $("#attachments");
  const composerEl = $("#composer");
  const composerWrap = $("#composer-wrap");
  const settingsBtn = $("#settings-btn");
  const settingsModal = $("#settings-modal");
  const settingsBackdrop = $("#settings-backdrop");
  const settingsClose = $("#settings-close");
  const settingsSave = $("#settings-save");
  const settingsStatus = $("#settings-status");
  const setApiKey = $("#set-api-key");
  const setModel = $("#set-model");
  const setDownloads = $("#set-downloads");
  const setWorkspace = $("#set-workspace");
  const wsPill = $("#ws-pill");
  const wsEditor = $("#ws-editor");
  const wsInput = $("#ws-input");
  const wsSave = $("#ws-save");
  const wsReset = $("#ws-reset");
  const wsCancel = $("#ws-cancel");
  const rewriteHint = $("#rewrite-hint");
  const rewriteCancel = $("#rewrite-cancel");
  const setTools = $("#set-tools");
  const setFont = $("#set-font");
  const fontValue = $("#font-value");
  const themeRow = $("#theme-row");
  const apiKeyHint = $("#api-key-hint");
  const modelHint = $("#model-hint");

  const SESSION_KEY = "tool-agent.session";
  const PREFS_KEY = "tool-agent.prefs";
  const COLLAPSED_KEY = "tool-agent.collapsed-groups";
  const MAX_IMAGES = 4;
  const MAX_EDGE = 1280; // long edge of the downscaled upload
  const JPEG_QUALITY = 0.85;

  const newSessionId = () =>
    "s" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  let streaming = false;
  /** Per-conversation live streams: sessionId -> { controller, turn }. */
  const running = new Map();

  function isRunning(id = sessionId) {
    return running.has(id);
  }
  let sessionId = localStorage.getItem(SESSION_KEY) || newSessionId();
  /** Attachments staged for the next turn. */
  let pendingImages = [];
  /** Conversation list from the server. */
  let sessions = [];
  /** Sidebar folders (may be empty). */
  let groups = [];
  /** Deleted groups that can still be restored. */
  let archivedGroups = [];
  let trashOpen = false;
  /** Collapsed groups, remembered across reloads. */
  let collapsedGroups = new Set();
  try {
    collapsedGroups = new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY) || "[]"));
  } catch { /* ignore corrupted state */ }
  let supportsImages = false;
  /** UI-only preferences (font size / theme) — never leave the browser. */
  let prefs = { font: 15, theme: "dark" };

  function loadPrefs() {
    try {
      prefs = { ...prefs, ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") };
    } catch { /* corrupted prefs are not worth failing over */ }
  }

  function savePrefs() {
    localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  }

  function applyPrefs() {
    document.documentElement.style.setProperty("--font-size", `${prefs.font}px`);
    const auto = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.body.dataset.theme = prefs.theme === "auto" ? auto : prefs.theme;
    for (const button of themeRow.querySelectorAll("button")) {
      button.classList.toggle("active", button.dataset.theme === prefs.theme);
    }
  }

  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
    if (prefs.theme === "auto") applyPrefs();
  });

  function persistSession() {
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  /* ------------------------------------------------------------------ *
   * Minimal, XSS-safe Markdown renderer (no CDN, no dependencies)      *
   * ------------------------------------------------------------------ */
  const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ESCAPES[c]);

  function safeUrl(url) {
    const trimmed = url.trim();
    return /^https?:\/\//i.test(trimmed) ? trimmed : "#";
  }

  function inline(text) {
    return text
      .replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
        (_, label, url) => `<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`)
      .replace(/\*\*([^*]+)\*\*(?!\d)/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
      .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>");
  }

  function renderMarkdown(raw) {
    if (!raw) return "";
    let text = escapeHtml(raw);

    // 1. pull fenced code blocks out so their contents are never inline-parsed
    const blocks = [];
    text = text.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const cls = lang ? ` class="language-${lang}"` : "";
      blocks.push(`<pre><code${cls}>${code.replace(/\n$/, "")}</code></pre>`);
      return `\u0000B${blocks.length - 1}\u0000`;
    });

    // 2. block-level parsing, line by line
    const out = [];
    let list = null; // { tag: 'ul' | 'ol' }
    let table = null; // rows of cells, first row becomes <th>
    let para = [];
    const flushPara = () => {
      if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
    };
    const closeList = () => {
      if (list) { out.push(`</${list.tag}>`); list = null; }
    };
    const flushTable = () => {
      if (!table) return;
      const rows = table
        .map((cells, index) => {
          const tag = index === 0 ? "th" : "td";
          return `<tr>${cells.map((c) => `<${tag}>${inline(c)}</${tag}>`).join("")}</tr>`;
        })
        .join("");
      out.push(`<table>${rows}</table>`);
      table = null;
    };
    /** Close whatever block is open before starting a different one. */
    const flushBlock = () => { flushPara(); closeList(); flushTable(); };

    for (const line of text.split("\n")) {
      const t = line.trim();
      if (!t) { flushBlock(); continue; }

      const fence = t.match(/^\u0000B(\d+)\u0000$/);
      if (fence) { flushBlock(); out.push(blocks[Number(fence[1])]); continue; }

      const heading = t.match(/^(#{1,4})\s+(.*)$/);
      if (heading) {
        flushBlock();
        out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
        continue;
      }

      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushBlock(); out.push("<hr />"); continue; }

      const quote = t.match(/^&gt;\s?(.*)$/);
      if (quote) { flushBlock(); out.push(`<blockquote>${inline(quote[1])}</blockquote>`); continue; }

      const ul = t.match(/^[-*+]\s+(.*)$/);
      const ol = t.match(/^\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        flushPara(); flushTable();
        const tag = ul ? "ul" : "ol";
        if (!list || list.tag !== tag) { closeList(); out.push(`<${tag}>`); list = { tag }; }
        out.push(`<li>${inline((ul || ol)[1])}</li>`);
        continue;
      }

      // Pipe table: consecutive rows become ONE table, first row is the header.
      if (/^\|.*\|$/.test(t)) {
        const cells = t.slice(1, -1).split("|").map((c) => c.trim());
        if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue; // |---| separator row
        if (!table) { flushPara(); closeList(); table = []; }
        table.push(cells);
        continue;
      }

      flushTable(); closeList();
      para.push(t);
    }
    flushBlock();

    // 3. restore code blocks
    return out.join("\n").replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[Number(i)]);
  }

  /* ------------------------------------------------------------------ *
   * DOM helpers                                                        *
   * ------------------------------------------------------------------ */
  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
